<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS AI</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#050914;color:#eaf6ff;
font-family:Arial,sans-serif;min-height:100vh
}
header{
padding:20px;display:flex;align-items:center;gap:12px;
border-bottom:1px solid #18334c
}
.logo{
width:42px;height:42px;border:1px solid #20cfff;
border-radius:12px;display:grid;place-items:center;
color:#20cfff;font-size:24px
}
header h1{font-size:18px;letter-spacing:3px;margin:0}
header p{font-size:10px;color:#7193b2;margin-top:5px}
.online{margin-left:auto;color:#53e8bd;font-size:11px}
main{max-width:650px;margin:auto;padding:20px}
.hero{text-align:center;padding:20px 0}
.orb{
width:130px;height:130px;border-radius:50%;margin:20px auto;
background:radial-gradient(circle at 35% 30%,#d9ffff,#39cfff 25%,#0751a6 65%,#061226);
box-shadow:0 0 35px #00baff,0 0 90px #0077ff55;
animation:pulse 3s infinite
}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 60px #00d9ff}}
.hero h2{letter-spacing:6px;margin-bottom:5px}
.hero p{color:#46cfff;font-size:11px;letter-spacing:3px}
.welcome{color:#8ca9c4;font-size:14px;line-height:1.6}
#chat{
height:350px;overflow-y:auto;border:1px solid #173652;
border-radius:15px;background:#081321;padding:12px
}
.msg{padding:12px;margin:10px 0;border-radius:12px;
font-size:14px;line-height:1.5;white-space:pre-wrap}
.ai{background:#10253b;border:1px solid #1d4968}
.user{background:#063a5b;border:1px solid #087db2}
.label{font-size:10px;color:#42d3ff;display:block;margin-bottom:5px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tools button{background:#0b1928;color:#a6c9e8;border:1px solid #204365;
padding:10px;border-radius:20px}
.input{
display:flex;gap:8px;padding:8px;border:1px solid #21415e;
border-radius:14px;background:#0b1624;margin-top:10px
}
input{flex:1;min-width:0;background:transparent;color:white;
border:0;outline:0;padding:10px;font-size:15px}
button{cursor:pointer}
.send,.mic{border:0;border-radius:10px;padding:12px}
.send{background:#078fd1;color:white}
.mic{background:#122b43;color:#40d2ff}
footer{text-align:center;color:#48637e;font-size:10px;
letter-spacing:2px;padding:20px}
</style>
</head>
<body>
<header>
<div class="logo">N</div>
<div>
<h1>NEXUS AI</h1>
<p>YOUR INTELLIGENT ASSISTANT</p>
</div>
<div class="online">● ONLINE</div>
</header>

<main>
<div class="hero">
<div class="orb"></div>
<h2>NEXUS</h2>
<p>AI ASSISTANT</p>
<div class="welcome">Your AI assistant for ideas, learning and everyday questions.</div>
</div>

<div id="chat">
<div class="msg ai"><span class="label">NEXUS</span>
Welcome! I'm your AI assistant prototype. Send me a message to begin.</div>
</div>

<div class="tools">
<button onclick="ask('Help me study')">📚 Study</button>
<button onclick="ask('Give me an interesting fact')">✦ Interesting fact</button>
<button onclick="ask('Help me plan my day')">◷ Plan my day</button>
</div>

<div class="input">
<input id="input" placeholder="Message NEXUS..." />
<button class="mic" onclick="voice()">🎙</button>
<button class="send" onclick="send()">➤</button>
</div>
</main>

<footer>NEXUS AI · VERSION 1.0</footer>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("input");

function add(text,type){
const div=document.createElement("div");
div.className="msg "+type;
if(type==="ai"){
const label=document.createElement("span");
label.className="label";
label.textContent="NEXUS";
div.appendChild(label);
}
div.appendChild(document.createTextNode(text));
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
}

function ask(text){
input.value=text;
send();
}

function reply(text){
const t=text.toLowerCase();
if(t.includes("hello")||t.includes("hi"))return "Hello! Welcome to NEXUS AI. How can I help?";
if(t.includes("your name"))return "I'm NEXUS AI, your digital assistant.";
if(t.includes("time"))return "Your device time is "+new Date().toLocaleTimeString();
if(t.includes("date"))return "Today is "+new Date().toLocaleDateString();
if(t.includes("study"))return "Let's study! Tell me your subject and topic, and we can work through it together.";
if(t.includes("plan"))return "Start with your most important task, take breaks, finish your work, and leave time to relax.";
if(t.includes("fact"))return "Octopuses have three hearts and blue blood!";
return "I received your message: "+text+". I'm currently running in prototype mode. A real AI connection is needed for intelligent answers.";
}

function send(){
const text=input.value.trim();
if(!text)return;
add(text,"user");
input.value="";
const answer=reply(text);
setTimeout(()=>{
add(answer,"ai");
speak(answer);
},400);
}

input.addEventListener("keydown",e=>{
if(e.key==="Enter")send();
});

function speak(text){
if(!window.speechSynthesis)return;
speechSynthesis.cancel();
const utterance=new SpeechSynthesisUtterance(text);
utterance.lang="en-US";
speechSynthesis.speak(utterance);
}

function voice(){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){
add("Voice input is not supported in this browser. Please type your message.","ai");
return;
}
const r=new SR();
r.lang="en-US";
r.onresult=e=>{
input.value=e.results[0][0].transcript;
send();
};
r.onerror=()=>add("Voice recognition failed. Please try typing.","ai");
r.start();
}
</script>
</body>
</html>
